# Copy into a consuming application that implements npm run build / npm start
# and exposes GET /healthz. This library itself is not an HTTP browser service.
name: browser-application
services:
  browser-worker:
    path: .
    kind: api
    build:
      strategy: railpack
      command: npm run build
      packages:
        build:
          - python3
          - make
          - g++
        runtime:
          - ca-certificates
          - fonts-liberation
          - libasound2
          - libatk1.0-0
          - libatk-bridge2.0-0
          - libcairo2
          - libcups2
          - libcurl3-gnutls
          - libdbus-1-3
          - libexpat1
          - libfontconfig1
          - libgbm1
          - libglib2.0-0
          - libgtk-3-0
          - libnspr4
          - libnss3
          - libpango-1.0-0
          - libpangocairo-1.0-0
          - libx11-6
          - libx11-xcb1
          - libxcb1
          - libxcomposite1
          - libxcursor1
          - libxdamage1
          - libxext6
          - libxfixes3
          - libxi6
          - libxrandr2
          - libxrender1
          - libxss1
          - libxtst6
          - xdg-utils
    run:
      command: npm start
    readiness:
      type: http
      path: /healthz
      timeoutMs: 30000
